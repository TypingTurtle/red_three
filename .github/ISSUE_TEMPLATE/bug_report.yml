name: Bug report
description: Something crashes, freezes, looks wrong, sounds wrong or doesn't respond.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! A few details make a problem much quicker to find and fix. One problem per issue, please.
        **Attach the session log of the play session where the problem happened**: a bug report can't be sent without it. "Session log" below says where it is.

  - type: input
    id: version
    attributes:
      label: Red Three commit
      description: The commit you built from (`git log --oneline -1` in your red_three folder), or the date you downloaded it.
      placeholder: "343ddb3"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - Steam Deck
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw or heard, and what you expected instead.
      placeholder: "The game froze for a second every few seconds, and the sound crackled."
    validations:
      required: true

  - type: textarea
    id: where
    attributes:
      label: Where, and how to make it happen
      description: The mission (or menu, cutscene, launcher) and the moment. Does it happen every time? The steps to get there help a lot.
      placeholder: |
        Revenge of the Empire, flying low over the river. Every time.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Session log (required)
      description: |
        **A bug report needs the log of the play session where the problem happened.** Every start of Red Three writes a new log, named by the date and time it started (`red_two_2026-11-19_18-36-22.log`). If you started Red Three again after the problem, the newest log is from that later start: pick the one from the session where it happened, by its date and time. Drag it into this box.
        - **Windows**: the `user\logs` folder next to `red_three.exe`
        - **Steam Deck / Linux**: `~/.local/share/Red Three/logs`

        It lists your settings, the frame rate every 30 seconds, and what the game was doing in a freeze or a crash. It also shows folder paths, which can include your user name: edit those out if you like.
      placeholder: "Drop red_two_<date>_<time>.log here"
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Your controller (and whether you start Red Three through Steam), your display and the aspect ratio you play at, a texture pack if you use one, your PC's CPU and graphics card.
      placeholder: "DualSense over Bluetooth, started from Steam; 3440x1440, 21:9, 120 fps; HD texture pack; Ryzen 7 5800X, RTX 3070"

  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: For anything you can see, a screenshot or a short clip (drag it in) shows it best.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I'm playing my own disc image of the USA release of Rebel Strike (GLRE64)
          required: true
        - label: The log I attached is from the play session where the problem happened, not from a later start of Red Three (I checked its date and time)
          required: true
        - label: I looked at the open issues and docs/KNOWN_ISSUES.md, and this one isn't there yet
